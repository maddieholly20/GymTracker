<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFF5F9;
    --panel: #FFFFFF;
    --panel-2: #FFEBF3;
    --chalk: #5B3A4C;
    --muted: #C093A8;
    --accent: #FF8FB4;
    --accent-dim: #FF6FA0;
    --success: #7FDDB0;
    --border: #FBD6E6;
    --warn-bg: #FFF0E0;
    --warn-border: #F4C99A;
    --warn-text: #8A5A20;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--chalk);
    font-family: 'Quicksand', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 100px;
    min-height: 100vh;
  }

  .headline {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  header.top h1 { font-size: 22px; margin: 0; }
  header.top .today { font-size: 13px; color: var(--muted); font-weight: 600; }

  .tabs {
    display: flex;
    gap: 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .tab {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    padding: 0 0 10px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: inherit;
  }
  .tab.active { color: var(--chalk); border-bottom-color: var(--accent); }

  .view { display: none; }
  .view.active { display: block; }

  /* shared cards */
  .exercise-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(255, 143, 180, 0.08);
  }
  .exercise-card .ex-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .exercise-card .ex-head h3 { font-size: 16px; margin: 0; font-weight: 700; }
  .ex-target { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 600; }

  .ex-remove {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
    flex-shrink: 0;
  }
  .ex-remove:hover { color: var(--accent-dim); }

  .set-row {
    display: grid;
    grid-template-columns: 22px 1fr 1fr 34px;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
  }
  .set-row .set-idx { color: var(--muted); font-size: 13px; text-align: center; font-weight: 700; }
  .set-row input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--chalk);
    font-size: 15px;
    padding: 8px 6px;
    text-align: center;
    font-family: inherit;
    font-weight: 600;
  }
  .set-row input::placeholder { color: #E3AFC7; }
  .set-row .col-labels { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }

  .set-done {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .set-done.done { background: var(--success); border-color: var(--success); color: #145036; }

  .add-set-btn {
    background: none;
    border: 1px dashed var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 7px;
    width: 100%;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    font-family: inherit;
  }
  .add-set-btn:hover { color: var(--accent-dim); border-color: var(--accent); }

  .add-exercise-row { display: flex; gap: 8px; margin: 4px 0 20px; }
  .add-exercise-row input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--chalk);
    font-size: 15px;
    padding: 11px 12px;
    font-family: inherit;
  }

  .btn { border: none; border-radius: 10px; font-family: inherit; font-weight: 700; cursor: pointer; }
  .btn-accent { background: var(--accent); color: #fff; padding: 11px 18px; font-size: 14px; }
  .btn-accent:hover { background: var(--accent-dim); }

  .finish-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    padding: 24px 16px 18px;
    display: flex;
    justify-content: center;
  }
  .finish-bar .btn-accent { width: 100%; max-width: 448px; padding: 14px; font-size: 15px; letter-spacing: 0.02em; }

  .empty-state { text-align: center; padding: 40px 12px; color: var(--muted); }
  .empty-state .headline { font-size: 18px; color: var(--chalk); margin-bottom: 6px; }
  .empty-state p { font-size: 13px; line-height: 1.5; margin: 0; }

  /* history */
  .history-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .history-card .hc-top { display: flex; justify-content: space-between; align-items: baseline; cursor: pointer; }
  .history-card .hc-date { font-weight: 700; font-size: 15px; }
  .history-card .hc-stats { color: var(--muted); font-size: 12px; margin-top: 3px; cursor: pointer; font-weight: 600; }
  .history-detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: none; }
  .history-detail.open { display: block; }
  .hd-exercise { margin-bottom: 8px; }
  .hd-exercise .hd-name { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
  .hd-exercise .hd-sets { color: var(--muted); font-size: 12px; line-height: 1.6; font-weight: 600; }
  .hd-sets .set-done-mark { color: var(--success); }
  .hc-edit {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--accent-dim);
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    padding: 0;
    text-decoration: underline;
  }

  /* plan tab */
  .day-block { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .day-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; cursor: pointer; }
  .day-head .dh-name { font-weight: 700; font-size: 15px; }
  .day-head .dh-count { color: var(--muted); font-size: 12px; margin-left: 8px; font-weight: 600; }
  .day-head .dh-chevron { color: var(--muted); font-size: 12px; transition: transform 0.15s ease; }
  .day-head.open .dh-chevron { transform: rotate(90deg); }
  .day-body { display: none; padding: 0 14px 14px; }
  .day-body.open { display: block; }

  .plan-ex-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--border); }
  .plan-ex-row .pe-name { font-size: 14px; font-weight: 700; }
  .plan-ex-row .pe-target { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 600; }
  .plan-ex-row .ex-remove { font-size: 16px; }

  .plan-add-row { display: grid; grid-template-columns: 1fr 44px 44px 56px; gap: 6px; margin-top: 12px; }
  .plan-add-row input {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--chalk);
    font-size: 13px;
    padding: 8px 6px;
    text-align: center;
    font-family: inherit;
    min-width: 0;
  }
  .plan-add-row input.pe-name-input { text-align: left; padding-left: 8px; }
  .plan-field-labels {
    display: grid;
    grid-template-columns: 1fr 44px 44px 56px;
    gap: 6px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 700;
  }
  .plan-field-labels span:not(:first-child) { text-align: center; }
  .plan-add-row button {
    background: var(--accent);
    border: none;
    color: #fff;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .plan-add-row button:hover { background: var(--accent-dim); }

  .rest-note { color: var(--muted); font-size: 12px; padding: 4px 0 2px; font-weight: 600; }

  .saved-flag { font-size: 11px; color: var(--success); opacity: 0; transition: opacity 0.3s ease; margin-left: 8px; font-weight: 700; }
  .saved-flag.show { opacity: 1; }

  /* today tab date row */
  .date-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .date-row input[type="date"] {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--chalk);
    font-size: 14px;
    padding: 9px 10px;
    font-family: inherit;
    font-weight: 600;
  }
  .date-row .dr-weekday { font-size: 13px; color: var(--accent-dim); font-weight: 700; }

  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--chalk);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .reset-link {
    display: block;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 24px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-decoration: underline;
    font-weight: 600;
  }

  .storage-note {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
  }

  .loading-line { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; font-weight: 600; }
</style>

<div id="app">
  <header class="top">
    <h1 class="headline">🩰 Pretty Strong 🎧</h1>
    <span class="today" id="todayLabel"></span>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="today">Today 🎧</button>
    <button class="tab" data-tab="plan">Plan 🩰</button>
    <button class="tab" data-tab="history">History 💌</button>
  </div>

  <!-- TODAY -->
  <div class="view active" id="todayView">
    <div class="date-row">
      <input type="date" id="dateInput" />
      <span class="dr-weekday" id="weekdayLabel"></span>
    </div>

    <div id="todayExerciseList"></div>

    <div class="empty-state" id="todayEmptyState" style="display:none;">
      <div class="headline">Nothing planned 🎀</div>
      <p>No exercises are set for this day. Add one below if you trained anyway, or set up your plan in the Plan tab.</p>
    </div>

    <div class="add-exercise-row">
      <input type="text" id="newExerciseInput" placeholder="Add exercise (e.g. Bench Press)" />
      <button class="btn btn-accent" id="addExerciseBtn">Add 💕</button>
    </div>
  </div>

  <!-- PLAN -->
  <div class="view" id="planView">
    <div id="planList"></div>
  </div>

  <!-- HISTORY -->
  <div class="view" id="historyView">
    <div id="historyList"></div>
    <button class="reset-link" id="resetLink">Clear all saved history</button>
    <p class="storage-note" id="storageNote"></p>
  </div>

  <div class="finish-bar" id="finishBar" style="display:none;">
    <button class="btn btn-accent" id="finishBtn">Save Log 🩰</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const DB_PREFIX = 'pretty-strong:';

  /* ---------------- STORAGE (plain localStorage — synchronous, no network, no backend to fail) ---------------- */

  async function dbGet(key) {
    try {
      const raw = localStorage.getItem(DB_PREFIX + key);
      return raw !== null ? JSON.parse(raw) : null;
    } catch (e) {
      console.error('dbGet failed', key, e);
      return null;
    }
  }

  async function dbSet(key, value) {
    try {
      localStorage.setItem(DB_PREFIX + key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error('dbSet failed', key, e);
      return false;
    }
  }

  async function dbDelete(key) {
    try {
      localStorage.removeItem(DB_PREFIX + key);
      return true;
    } catch (e) {
      console.error('dbDelete failed', key, e);
      return false;
    }
  }

  async function dbListKeys(prefix) {
    const keys = [];
    try {
      const full = DB_PREFIX + (prefix || '');
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(full)) keys.push(k.slice(DB_PREFIX.length));
      }
    } catch (e) {
      console.error('dbListKeys failed', e);
    }
    return keys;
  }

  /* ---------------- DEFAULT PLAN ---------------- */

  function mkEx(name, targetSets, targetReps, targetWeight) {
    return { id: 'pe' + Math.random().toString(36).slice(2, 9), name, targetSets, targetReps, targetWeight };
  }

  const DEFAULT_PLAN = {
    Monday: [
      mkEx('Sumo Squats (Dumbbell)', 4, 12, 24),
      mkEx('Romanian Deadlifts / RDLs (Barbell)', 4, 10, 35),
      mkEx('Glute Bridges (Kettlebell)', 3, 17, 16),
      mkEx('Hamstring Extension (Machine)', 3, 13, 28),
      mkEx('Hamstring Curls (Machine)', 3, 13, 14),
      mkEx('Hip Thrusts (Smith, go heavy)', 3, 9, 30)
    ],
    Tuesday: [
      mkEx('Chest Press (Smith/Machine)', 3, 11, 21),
      mkEx('Incline Push-Ups (to failure)', 3, null, null),
      mkEx('Overhead Press (Kettlebells)', 3, 12, 14),
      mkEx('Lateral Raises (Dumbbells)', 3, 13, 5),
      mkEx('Cable Tricep Pulldowns', 3, 10, 20),
      mkEx('Plank', 3, null, null),
      mkEx('Russian Twists (Kettlebell, per side)', 3, 17, null)
    ],
    Wednesday: [
      mkEx('Active Recovery (cardio / mobility / light KB swings)', null, null, null),
      mkEx('Knee Tucks', 2, 12, null),
      mkEx('Ankle Taps', 2, 40, null),
      mkEx('Leg Raises', 2, 12, null),
      mkEx('Suitcase Crunch', 2, 10, null),
      mkEx('Deadbugs', 2, 20, null),
      mkEx('Plank', 1, null, null)
    ],
    Thursday: [
      mkEx('Leg Press (feet high)', 4, 12, 35),
      mkEx('Walking Lunges (Kettlebells, per leg)', 3, 13, null),
      mkEx('Hip Abductor (Machine)', 3, 12, 28),
      mkEx('Bulgarian Split Squats / Step Ups (Dumbbells, per leg)', 3, 10, 6),
      mkEx('Reverse Hypers / Glute Kickbacks (per leg)', 3, 17, null)
    ],
    Friday: [
      mkEx('Lat Pulldowns', 3, 11, 28),
      mkEx('Mid Rows', 3, 11, 28),
      mkEx('Bent Over Rows (Kettlebells)', 3, 11, 12),
      mkEx('Bicep Curls (Kettlebells, per arm)', 3, 13, 6),
      mkEx('Face Pulls', null, null, null),
      mkEx('HIIT: Kettlebell Swings (45s/15s)', 4, null, null),
      mkEx('HIIT: Jump Squats (45s/15s)', 4, null, null),
      mkEx('HIIT: Kettlebell Goblet Squat (45s/15s)', 4, null, null),
      mkEx('HIIT: Push-ups (45s/15s)', 4, null, null),
      mkEx('HIIT: Plank (45s/15s)', 4, null, null)
    ],
    Saturday: [],
    Sunday: []
  };

  /* ---------------- STATE ---------------- */

  let plan = {};
  let todayLog = { date: '', exercises: [] };
  let exIdCounter = 0;
  let openDayBlocks = {};

  const toast = document.getElementById('toast');
  const todayLabel = document.getElementById('todayLabel');
  const dateInput = document.getElementById('dateInput');
  const weekdayLabel = document.getElementById('weekdayLabel');
  const todayExerciseList = document.getElementById('todayExerciseList');
  const todayEmptyState = document.getElementById('todayEmptyState');
  const finishBar = document.getElementById('finishBar');

  todayLabel.textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function pad(n) { return String(n).padStart(2, '0'); }
  function toISODateLocal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function weekdayFromISO(iso) {
    const d = new Date(iso + 'T00:00:00');
    return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
  }
  function newSet() { return { reps: '', weight: '', done: false }; }

  function targetLabel(ex) {
    if (!ex) return '';
    const parts = [];
    if (ex.targetSets || ex.targetReps) parts.push((ex.targetSets || '?') + '×' + (ex.targetReps || '?'));
    if (ex.targetWeight) parts.push(ex.targetWeight + 'kg');
    return parts.length ? 'Target: ' + parts.join(' @ ') : '';
  }

  /* ---------------- PLAN ---------------- */

  async function loadPlan() {
    plan = await dbGet('weekly-plan');
    if (!plan) plan = {};
    DAYS.forEach(d => { if (!plan[d]) plan[d] = []; });

    const isEmpty = DAYS.every(d => plan[d].length === 0);
    if (isEmpty) {
      plan = DEFAULT_PLAN;
      const ok = await dbSet('weekly-plan', plan);
      showToast(ok ? 'Weekly plan imported 🩰' : 'Plan loaded, but saving it failed — your browser storage may be full or blocked');
    }

    renderPlan();
  }

  async function savePlan() {
    const ok = await dbSet('weekly-plan', plan);
    if (!ok) showToast('Could not save plan changes');
    return ok;
  }

  function renderPlan() {
    const planList = document.getElementById('planList');
    planList.innerHTML = '';

    DAYS.forEach(day => {
      const block = document.createElement('div');
      block.className = 'day-block';

      const head = document.createElement('div');
      head.className = 'day-head' + (openDayBlocks[day] ? ' open' : '');
      const count = plan[day].length;
      head.innerHTML = '<div><span class="dh-name">' + day + '</span><span class="dh-count">' +
        (count ? count + ' exercise' + (count !== 1 ? 's' : '') : 'Rest day') +
        '</span><span class="saved-flag" id="saved-' + day + '">Saved</span></div><span class="dh-chevron">›</span>';
      head.onclick = () => { openDayBlocks[day] = !openDayBlocks[day]; renderPlan(); };
      block.appendChild(head);

      const body = document.createElement('div');
      body.className = 'day-body' + (openDayBlocks[day] ? ' open' : '');

      if (plan[day].length === 0) {
        const note = document.createElement('div');
        note.className = 'rest-note';
        note.textContent = 'No exercises added for this day yet.';
        body.appendChild(note);
      }

      plan[day].forEach(ex => {
        const row = document.createElement('div');
        row.className = 'plan-ex-row';
        const label = targetLabel(ex);
        row.innerHTML = '<div><div class="pe-name"></div>' + (label ? '<div class="pe-target">' + label + '</div>' : '') + '</div>';
        row.querySelector('.pe-name').textContent = ex.name;
        const rm = document.createElement('button');
        rm.className = 'ex-remove';
        rm.textContent = '✕';
        rm.onclick = () => {
          plan[day] = plan[day].filter(e => e.id !== ex.id);
          savePlan();
          openDayBlocks[day] = true;
          renderPlan();
        };
        row.appendChild(rm);
        body.appendChild(row);
      });

      const fieldLabels = document.createElement('div');
      fieldLabels.className = 'plan-field-labels';
      fieldLabels.innerHTML = '<span>Exercise</span><span>Sets</span><span>Reps</span><span>Weight</span>';
      body.appendChild(fieldLabels);

      const addRow = document.createElement('div');
      addRow.className = 'plan-add-row';
      addRow.innerHTML =
        '<input type="text" class="pe-name-input" placeholder="Exercise name" />' +
        '<input type="number" class="pe-sets-input" placeholder="3" />' +
        '<input type="number" class="pe-reps-input" placeholder="10" />' +
        '<input type="number" class="pe-weight-input" placeholder="kg" />';
      const addBtn = document.createElement('button');
      addBtn.textContent = 'Add';
      addBtn.style.gridColumn = '1 / -1';
      addBtn.style.marginTop = '6px';
      addBtn.style.padding = '9px';
      addBtn.onclick = () => {
        const nameEl = addRow.querySelector('.pe-name-input');
        const setsEl = addRow.querySelector('.pe-sets-input');
        const repsEl = addRow.querySelector('.pe-reps-input');
        const weightEl = addRow.querySelector('.pe-weight-input');
        const name = nameEl.value.trim();
        if (!name) { nameEl.focus(); return; }
        plan[day].push(mkEx(
          name,
          setsEl.value ? Number(setsEl.value) : null,
          repsEl.value ? Number(repsEl.value) : null,
          weightEl.value ? Number(weightEl.value) : null
        ));
        savePlan();
        openDayBlocks[day] = true;
        renderPlan();
      };
      body.appendChild(addRow);
      body.appendChild(addBtn);

      block.appendChild(body);
      planList.appendChild(block);
    });
  }

  /* ---------------- TODAY / DAILY LOG ---------------- */

  function findTargetFor(name, weekday) {
    const list = plan[weekday] || [];
    return list.find(e => e.name.trim().toLowerCase() === name.trim().toLowerCase());
  }

  async function loadLogForDate(iso) {
    const weekday = weekdayFromISO(iso);
    weekdayLabel.textContent = weekday;

    const existing = await dbGet('workout:' + iso);
    if (existing) {
      todayLog = {
        date: iso,
        exercises: existing.exercises.map(ex => ({
          id: 'ex' + (exIdCounter++),
          name: ex.name,
          sets: ex.sets.map(s => ({ reps: String(s.reps ?? ''), weight: String(s.weight ?? ''), done: !!s.done }))
        }))
      };
      renderToday();
      return;
    }

    const planned = plan[weekday] || [];
    todayLog = {
      date: iso,
      exercises: planned.map(pe => ({
        id: 'ex' + (exIdCounter++),
        name: pe.name,
        planRef: pe,
        sets: Array.from({ length: pe.targetSets || 1 }, () => newSet())
      }))
    };
    renderToday();
  }

  function renderToday() {
    todayExerciseList.innerHTML = '';
    const weekday = weekdayFromISO(todayLog.date);

    if (todayLog.exercises.length === 0) {
      todayEmptyState.style.display = 'block';
      finishBar.style.display = 'none';
      return;
    }
    todayEmptyState.style.display = 'none';
    finishBar.style.display = 'flex';

    todayLog.exercises.forEach(ex => {
      const card = document.createElement('div');
      card.className = 'exercise-card';

      const target = ex.planRef || findTargetFor(ex.name, weekday);
      const label = targetLabel(target);

      const head = document.createElement('div');
      head.className = 'ex-head';
      head.innerHTML = '<div><h3></h3>' + (label ? '<div class="ex-target">' + label + '</div>' : '') + '</div>';
      head.querySelector('h3').textContent = ex.name;
      const removeBtn = document.createElement('button');
      removeBtn.className = 'ex-remove';
      removeBtn.textContent = '✕';
      removeBtn.onclick = () => { todayLog.exercises = todayLog.exercises.filter(e => e.id !== ex.id); renderToday(); };
      head.appendChild(removeBtn);
      card.appendChild(head);

      const labelRow = document.createElement('div');
      labelRow.className = 'set-row';
      labelRow.innerHTML = '<span></span><span class="col-labels">Reps</span><span class="col-labels">Weight (kg)</span><span></span>';
      card.appendChild(labelRow);

      ex.sets.forEach((set, i) => {
        const row = document.createElement('div');
        row.className = 'set-row';

        const idx = document.createElement('span');
        idx.className = 'set-idx';
        idx.textContent = i + 1;

        const repsInput = document.createElement('input');
        repsInput.type = 'number';
        repsInput.inputMode = 'numeric';
        repsInput.placeholder = target && target.targetReps ? String(target.targetReps) : '0';
        repsInput.value = set.reps;
        repsInput.oninput = (e) => { set.reps = e.target.value; };

        const weightInput = document.createElement('input');
        weightInput.type = 'number';
        weightInput.inputMode = 'decimal';
        weightInput.placeholder = target && target.targetWeight ? String(target.targetWeight) : '0';
        weightInput.value = set.weight;
        weightInput.oninput = (e) => { set.weight = e.target.value; };

        const doneBtn = document.createElement('button');
        doneBtn.className = 'set-done' + (set.done ? ' done' : '');
        doneBtn.textContent = '✓';
        doneBtn.onclick = () => { set.done = !set.done; doneBtn.classList.toggle('done'); };

        row.appendChild(idx);
        row.appendChild(repsInput);
        row.appendChild(weightInput);
        row.appendChild(doneBtn);
        card.appendChild(row);
      });

      const addSetBtn = document.createElement('button');
      addSetBtn.className = 'add-set-btn';
      addSetBtn.textContent = '+ Add set';
      addSetBtn.onclick = () => { ex.sets.push(newSet()); renderToday(); };
      card.appendChild(addSetBtn);

      todayExerciseList.appendChild(card);
    });
  }

  document.getElementById('addExerciseBtn').onclick = () => {
    const input = document.getElementById('newExerciseInput');
    const name = input.value.trim();
    if (!name) return;
    todayLog.exercises.push({ id: 'ex' + (exIdCounter++), name, sets: [newSet()] });
    input.value = '';
    renderToday();
  };
  document.getElementById('newExerciseInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('addExerciseBtn').click();
  });

  async function saveTodayLog() {
    const cleaned = todayLog.exercises
      .map(ex => ({
        name: ex.name,
        sets: ex.sets
          .filter(s => s.reps !== '' || s.weight !== '')
          .map(s => ({ reps: Number(s.reps) || 0, weight: Number(s.weight) || 0, done: s.done }))
      }))
      .filter(ex => ex.sets.length > 0);

    if (cleaned.length === 0) {
      showToast('Log at least one set first');
      return;
    }

    const record = { id: 'w' + todayLog.date, date: todayLog.date, dayName: weekdayFromISO(todayLog.date), exercises: cleaned };

    const weekday = weekdayFromISO(todayLog.date);
    let planUpdated = false;
    cleaned.forEach(ex => {
      const target = findTargetFor(ex.name, weekday);
      if (!target) return;

      if (target.targetWeight != null) {
        const maxWeightToday = ex.sets.reduce((max, s) => Math.max(max, s.weight), 0);
        if (maxWeightToday > target.targetWeight) { target.targetWeight = maxWeightToday; planUpdated = true; }
      }
      if (target.targetReps != null) {
        const maxRepsToday = ex.sets.reduce((max, s) => Math.max(max, s.reps), 0);
        if (maxRepsToday > target.targetReps) { target.targetReps = maxRepsToday; planUpdated = true; }
      }
    });

    const finishBtn = document.getElementById('finishBtn');
    finishBtn.disabled = true;
    finishBtn.textContent = 'Saving…';

    const savedLog = await dbSet('workout:' + todayLog.date, record);

    finishBtn.disabled = false;
    finishBtn.textContent = 'Save Log 🩰';

    if (!savedLog) {
      showToast('Could not save — your browser storage may be full or blocked');
      return;
    }

    if (planUpdated) {
      const ok = await savePlan();
      renderPlan();
      showToast(ok ? 'Log saved — plan updated 🎧💗' : 'Log saved — plan update failed to save');
    } else {
      showToast('Log saved 🩰');
    }
    loadHistory();
  }

  document.getElementById('finishBtn').onclick = saveTodayLog;

  dateInput.addEventListener('change', () => {
    if (dateInput.value) loadLogForDate(dateInput.value);
  });

  /* ---------------- TABS ---------------- */

  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab + 'View').classList.add('active');
      finishBar.style.display = (tab.dataset.tab === 'today' && todayLog.exercises.length > 0) ? 'flex' : 'none';
      if (tab.dataset.tab === 'history') loadHistory();
    };
  });

  /* ---------------- HISTORY ---------------- */

  function volumeOf(record) {
    return record.exercises.reduce((sum, ex) => sum + ex.sets.reduce((s, set) => s + set.reps * set.weight, 0), 0);
  }
  function setCountOf(record) {
    return record.exercises.reduce((sum, ex) => sum + ex.sets.length, 0);
  }

  async function loadHistory() {
    const historyList = document.getElementById('historyList');
    historyList.innerHTML = '<div class="loading-line">Loading past workouts…</div>';
    const keys = await dbListKeys('workout:');

    if (keys.length === 0) {
      historyList.innerHTML = '<div class="empty-state"><div class="headline">No history yet 🎀</div><p>Save a log on the Today tab and it will show up here.</p></div>';
      return;
    }

    const records = (await Promise.all(keys.map(k => dbGet(k)))).filter(Boolean);
    records.sort((a, b) => new Date(b.date) - new Date(a.date));

    historyList.innerHTML = '';
    records.forEach(record => {
      const card = document.createElement('div');
      card.className = 'history-card';

      const top = document.createElement('div');
      top.className = 'hc-top';
      const dateEl = document.createElement('span');
      dateEl.className = 'hc-date';
      dateEl.textContent = new Date(record.date + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      top.appendChild(dateEl);
      card.appendChild(top);

      const stats = document.createElement('div');
      stats.className = 'hc-stats';
      stats.textContent = record.exercises.length + ' exercise' + (record.exercises.length !== 1 ? 's' : '') +
        ' · ' + setCountOf(record) + ' sets · ' + volumeOf(record).toLocaleString() + ' kg total volume';
      card.appendChild(stats);

      const detail = document.createElement('div');
      detail.className = 'history-detail';
      record.exercises.forEach(ex => {
        const hd = document.createElement('div');
        hd.className = 'hd-exercise';
        const name = document.createElement('div');
        name.className = 'hd-name';
        name.textContent = ex.name;
        const sets = document.createElement('div');
        sets.className = 'hd-sets';
        sets.innerHTML = ex.sets.map(s => s.reps + ' × ' + s.weight + 'kg' + (s.done ? ' <span class="set-done-mark">✓</span>' : '')).join(' &nbsp;·&nbsp; ');
        hd.appendChild(name);
        hd.appendChild(sets);
        detail.appendChild(hd);
      });
      card.appendChild(detail);

      const editBtn = document.createElement('button');
      editBtn.className = 'hc-edit';
      editBtn.textContent = 'Edit this day →';
      editBtn.onclick = (e) => {
        e.stopPropagation();
        dateInput.value = record.date;
        loadLogForDate(record.date);
        document.querySelector('.tab[data-tab="today"]').click();
      };
      detail.appendChild(editBtn);

      const toggle = () => detail.classList.toggle('open');
      top.onclick = toggle;
      stats.onclick = toggle;

      historyList.appendChild(card);
    });
  }

  document.getElementById('resetLink').onclick = async () => {
    if (!confirm('Delete all saved workout history? This cannot be undone.')) return;
    const keys = await dbListKeys('workout:');
    await Promise.all(keys.map(k => dbDelete(k)));
    showToast('History cleared');
    loadHistory();
  };

  /* ---------------- INIT ---------------- */

  async function init() {
    const iso = toISODateLocal(new Date());
    dateInput.value = iso;
    const note = document.getElementById('storageNote');
    if (note) note.textContent = "Saved right on this device's browser — it won't follow you to a different phone or browser, or survive fully closing this artifact in Claude.";
    await loadPlan();
    await loadLogForDate(iso);
  }

  init();
})();
</script>
